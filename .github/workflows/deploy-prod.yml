name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (must have images built in ghcr.io)"
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  verify-images:
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify web image exists
        run: docker manifest inspect ghcr.io/${{ github.repository_owner }}/headless-wp-starter-web:${{ inputs.sha }}

      - name: Verify cms image exists
        run: docker manifest inspect ghcr.io/${{ github.repository_owner }}/headless-wp-starter-cms:${{ inputs.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: verify-images
    environment: production
    steps:
      - name: Check deploy configuration
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Deploy requires VPS_HOST and SSH_KEY secrets in the production environment."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Copy files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,infra/caddy/Caddyfile,infra/backup/Dockerfile,infra/backup/backup.sh,infra/loki/loki-config.yml,infra/alloy/config.alloy,infra/prometheus/prometheus.yml,infra/grafana/provisioning,infra/grafana/dashboards"
          target: /opt/app

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/app
            export WP_IMAGE_TAG=${{ inputs.sha }}
            export WEB_IMAGE_TAG=${{ inputs.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T wordpress wp-init.sh
            docker image prune -a -f

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - name: Wait for services to stabilize
        run: sleep 15

      - name: Check frontend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.WEB_DOMAIN }}")
          echo "Frontend status: $status"
          [ "$status" = "200" ] || exit 1

      - name: Check WordPress GraphQL
        run: |
          response=$(curl -s -w "\n%{http_code}" "https://${{ secrets.CMS_DOMAIN }}/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ generalSettings { title } }"}')
          status=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -1)
          echo "GraphQL status: $status"
          echo "GraphQL response: $body"
          [ "$status" = "200" ] || exit 1
          echo "$body" | grep -q "generalSettings" || exit 1

      - name: Check container health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/app
            unhealthy=$(docker compose -f docker-compose.prod.yml ps --format json | grep -v '"healthy"' | grep -v '"running"' | grep -c '"' || true)
            if [ "$unhealthy" -gt 0 ]; then
              echo "Unhealthy containers found:"
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi
            echo "All containers healthy"
            docker compose -f docker-compose.prod.yml ps
            # Verify deployed version
            version=$(docker compose -f docker-compose.prod.yml exec -T web printenv BUILD_VERSION 2>/dev/null || echo "unknown")
            echo "Deployed version: $version"

  tag-release:
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: |
          date_prefix=$(date -u +%Y-%m-%d)
          # Find existing tags for today and increment
          existing=$(git tag -l "${date_prefix}.*" | sort -t. -k2 -n | tail -1)
          if [ -z "$existing" ]; then
            tag="${date_prefix}.1"
          else
            n=$(echo "$existing" | cut -d. -f4)
            tag="${date_prefix}.$((n + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $tag"

      - name: Generate changelog
        id: changelog
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            log=$(git log --oneline --no-decorate ${{ inputs.sha }} | head -50)
          else
            log=$(git log --oneline --no-decorate "${last_tag}..${{ inputs.sha }}")
          fi
          # Write to file to handle multiline
          echo "$log" > /tmp/changelog.txt
          echo "Generated changelog from ${last_tag:-beginning} to ${{ inputs.sha }}"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ steps.tag.outputs.tag }} ${{ inputs.sha }}
          git push origin ${{ steps.tag.outputs.tag }}
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "$(cat /tmp/changelog.txt)" \
            --target ${{ inputs.sha }}
